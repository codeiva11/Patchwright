name: Patchwright Chromium Tests

on:
  workflow_call:
    inputs:
      playwright_version:
        description: 'Playwright version (tag) to test against, e.g. v1.58.0 or 1.58.0. If empty, latest release is used.'
        required: false
        type: string
    outputs:
      test_outcome:
        description: Combined result for page/library test steps
        value: ${{ jobs.run-patchwright-tests.outputs.test_outcome }}
  workflow_dispatch:
    inputs:
      playwright_version:
        description: 'Playwright version (tag) to test against, e.g. v1.58.0 or 1.58.0. If empty, latest release is used.'
        required: false
        type: string
  push:
    branches: [main, dev-tests]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  run-patchwright-tests:
    runs-on: ubuntu-latest
    outputs:
      test_outcome: ${{ steps.set_test_outcome.outputs.test_outcome }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Setup Node v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Playwright Driver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch_version="${{ inputs.playwright_version || github.event.inputs.playwright_version }}"
          if [ -z "$branch_version" ]; then
            response=$(curl --silent -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/microsoft/playwright/releases/latest" || true)
            branch_version=$(echo "$response" | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi
          if [ -z "$branch_version" ] || [ "$branch_version" = "v0.0.0" ]; then
            branch_version="v1.51.0"
          else
            branch_version="v${branch_version#v}"
          fi
          echo "Resolved Playwright version: $branch_version"
          git clone --depth 1 https://github.com/microsoft/playwright --branch "$branch_version"
          cd playwright
          npm ci

      - name: Patch Playwright Driver
        run: npm run patch

      - name: Generate Channels
        run: |
          cd playwright
          node utils/generate_channels.js || true

      - name: Build Patchwright Driver
        run: |
          cd playwright
          # The first build bootstraps generated channel files; rerun once if that
          # bootstrap step races the rest of the build.
          npm run build || npm run build

      - name: Install Browser Dependencies
        run: |
          cd playwright
          npx playwright install-deps

      # Patchwright never downloads bundled Chrome-for-Testing builds: CI installs the
      # official Google Chrome deb (GPG-verified) so the tests run a real system browser,
      # exactly like production launches do.
      - name: Install System Google Chrome
        run: |
          curl -fsSL -o /tmp/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome-stable_current_amd64.deb

      - name: Install FFmpeg for Video Tests
        run: |
          cd playwright
          npx playwright install ffmpeg

      - name: Run Detection Smoke Test
        id: test_detection
        continue-on-error: ${{ github.event_name == 'workflow_call' }}
        run: xvfb-run -a node utils/detection_smoke_test.mjs

      - name: Run Runtime Smoke Test (new core patches)
        id: test_runtime
        continue-on-error: ${{ github.event_name == 'workflow_call' }}
        run: xvfb-run -a node utils/custom_tests/runtime_smoke_test.mjs

      - name: Run Service Worker Identity Smoke Test
        id: test_service_worker
        continue-on-error: ${{ github.event_name == 'workflow_call' }}
        run: xvfb-run -a node utils/custom_tests/service_worker_smoke_test.mjs

      - name: Run TLS/JA4 Alignment Check
        id: test_tls
        continue-on-error: ${{ github.event_name == 'workflow_call' }}
        run: xvfb-run -a node utils/custom_tests/tls_ja4_check.mjs

      - name: Modify Tests for Patchwright
        run: npx tsx utils/modify_tests.ts

      - name: Run Page Tests
        id: test_page
        timeout-minutes: 25
        continue-on-error: ${{ github.event_name == 'workflow_call' }}
        run: |
          cd playwright
          PWTEST_MODE=driver xvfb-run -a npx playwright test --config=tests/library/playwright.config.ts --project=chromium-page --max-failures=0 --reporter=line --retries=3

      - name: Run Library Tests
        id: test_library
        timeout-minutes: 40
        continue-on-error: ${{ github.event_name == 'workflow_call' }}
        run: |
          cd playwright
          PWTEST_MODE=driver xvfb-run -a npx playwright test --config=tests/library/playwright.config.ts --project=chromium-library --max-failures=0 --reporter=line --retries=3

      - name: Set Test Outcome
        id: set_test_outcome
        if: always()
        run: |
          if [ "${{ steps.test_detection.outcome }}" != "success" ] || [ "${{ steps.test_runtime.outcome }}" != "success" ] || [ "${{ steps.test_service_worker.outcome }}" != "success" ] || [ "${{ steps.test_tls.outcome }}" != "success" ] || [ "${{ steps.test_page.outcome }}" != "success" ] || [ "${{ steps.test_library.outcome }}" != "success" ]; then
            echo "test_outcome=failure" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_call" ]; then
              echo "Tests failed under workflow_call, exiting with failure code."
              exit 1
            fi
          else
            echo "test_outcome=success" >> "$GITHUB_OUTPUT"
          fi
