name: Patchwright Hotfix Release

# Re-release Patchwright features on TOP of an already-published upstream Playwright
# version WITHOUT waiting for the next Playwright release. The build keeps the SAME
# version number as the upstream Playwright release (e.g. 1.65.1) and is pushed to
# BOTH channels:
#
#  - npm: published if that exact version is still free on the registry; if the same
#    version already exists there (e.g. a buggy 1.65.1), npm publishing is skipped
#    automatically and the fixed build goes out through GitHub instead.
#  - GitHub: ALWAYS — the tarball is attached to the GitHub release for that same
#    version (assets are replaced with --clobber if the release already exists).
#
# Consumers install the fixed build straight from GitHub when npm already has the
# version:
#
#   npm i https://github.com/<owner>/<repo>/releases/download/1.65.1/patchwright-core-1.65.1.tgz

on:
  workflow_dispatch:
    inputs:
      playwright_tag:
        description: 'Upstream Playwright tag to build against (e.g. v1.65.1)'
        required: true
        default: 'v1.65.1'
      version:
        description: 'Optional release version override. Defaults to the Playwright version itself (e.g. 1.65.1).'
        required: false
        default: ''
      npm_publish:
        description: 'Attempt npm publish (skipped automatically if the same version already exists there)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  hotfix-build-and-publish:
    name: Hotfix Build & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Setup Node v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install NPM Dependencies (Patchwright)
        run: npm ci

      - name: Compute Release Version
        id: version
        run: |
          set -euo pipefail
          playwright_tag="${{ github.event.inputs.playwright_tag }}"
          playwright_version="${playwright_tag#v}"
          explicit="${{ github.event.inputs.version }}"
          version="${explicit:-$playwright_version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version} (source Playwright ${playwright_version})"

      - name: Install Playwright Driver Source
        run: |
          git clone --depth 1 https://github.com/microsoft/playwright --branch "${{ github.event.inputs.playwright_tag }}"
          cd playwright
          npm ci

      - name: Apply AST Patches
        run: npm run patch

      - name: Generate Playwright Channels
        run: |
          cd playwright
          node utils/generate_channels.js || true

      - name: Build Patchwright Packages
        run: |
          cd playwright
          npm run build || true
          npm run build

      - name: Rebrand With Release Version
        env:
          PATCHWRIGHT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd playwright
          npx tsx ../utils/patchwright_rebranding.ts
          echo "Built patchwright-core@$(node -p "require('./packages/patchwright-core/package.json').version")"

      - name: Pack Tarballs
        run: |
          cd playwright/packages/patchwright-core
          npm pack --pack-destination ../../..
          cd ../patchwright
          npm pack --pack-destination ../../.. || true

      - name: Verify Core Tarball Contains Hotfix Features
        run: |
          version="${{ steps.version.outputs.version }}"
          tarball="patchwright-core-${version}.tgz"
          test -f "$tarball"
          bundle=$(tar -xOf "$tarball" package/lib/coreBundle.js)
          for marker in patchwrightAutoInstallSystemBrowser patchwrightSystemBrowserCandidates _applySystemStealthOverride fingerprintingV2 realFullVersion PATCHWRIGHT_BINARY PATCHWRIGHT_WEBRTC_POLICY moveHuman; do
            echo "$bundle" | grep -q "$marker" || { echo "Missing feature marker: $marker"; exit 1; }
          done
          echo "All feature markers present in ${tarball}."

      - name: Publish to npm (skipped when the version already exists there)
        if: ${{ github.event.inputs.npm_publish == 'true' || github.event.inputs.npm_publish == true }}
        id: npm_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tarball="patchwright-core-${version}.tgz"
          if npm view "patchwright-core@${version}" version >/dev/null 2>&1; then
            echo "patchwright-core@${version} already on npm — skipping npm publish."
            echo "result=exists-on-npm" >> "$GITHUB_OUTPUT"
          else
            npm publish "$tarball" --access=public
            echo "result=published-to-npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Create/Update GitHub Release (same-version assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          tarball="patchwright-core-${version}.tgz"
          channel_note="npm already has ${version}, so install this fixed build from GitHub: npm i https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/${tarball}"
          if [ "${{ steps.npm_publish.outputs.result }}" = "published-to-npm" ]; then
            channel_note="Published to npm as patchwright-core@${version}. Also available on this release: npm i https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/${tarball}"
          fi
          if gh release view "${version}" >/dev/null 2>&1; then
            gh release upload "${version}" "$tarball" --clobber
            gh release edit "${version}" --notes "Fixed build with all Patchwright features, based on upstream Playwright ${{ github.event.inputs.playwright_tag }}. ${channel_note}"
          else
            gh release create "${version}" \
              --title "Patchwright ${version}" \
              --notes "Fixed build with all Patchwright features, based on upstream Playwright ${{ github.event.inputs.playwright_tag }}. ${channel_note}" \
              "$tarball"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchwright-core-${{ steps.version.outputs.version }}
          path: patchwright-core-*.tgz
          if-no-files-found: error
